displayName: "Latência alta Cloud Run Event-Images"
combiner: "OR"
conditions:
  - displayName: "P95 > 2s"
    conditionThreshold:
      filter: |
        resource.type="cloud_run_revision"
        resource.labels.service_name="event-images"
        metric.type="run.googleapis.com/request_latencies"
      comparison: COMPARISON_GT
      thresholdValue: 2
      duration: "60s"
      aggregations:
        - perSeriesAligner: ALIGN_PERCENTILE_95
          alignmentPeriod: "60s"
notificationChannels:
  - projects/pucminas-507118/notificationChannels/1982097352830072884




