displayName: "Pub/Sub com mensagens acumuladas"
combiner: "OR"
conditions:
  - displayName: "Backlog > 100 mensagens"
    conditionThreshold:
      filter: |
        resource.type="pubsub_subscription"
        metric.type="pubsub.googleapis.com/subscription/num_undelivered_messages"
      comparison: COMPARISON_GT
      thresholdValue: 100
      duration: "300s"
